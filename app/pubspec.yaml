name: autosense_ai
description: AutoSense AI — automotive OBD-II diagnostic guidance, live telemetry dashboard, and performance estimator.
publish_to: none
version: 1.0.0+6
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  cupertino_icons: ^1.0.8
  flutter_reactive_ble: 5.6.0
  permission_handler: 13.0.2
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.4
  image_picker: ^1.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/hero_car.png
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Saira.txt
  fonts:
    - family: Saira
      fonts:
        - asset: assets/fonts/Saira-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Saira-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
